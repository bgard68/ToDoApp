# Runs the API and the nginx-served SPA together.
#   1) copy .env.example to .env and set JWT_KEY (and optionally GOOGLE_CLIENT_ID)
#   2) docker compose up --build
#   3) open http://localhost:8080
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      # Required — the app will not start without a signing key.
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      ConnectionStrings__DefaultConnection: Data Source=/data/todoapp.db
      Cors__AllowedOrigins__0: http://localhost:8080
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - todo-data:/data
    # Not published to the host; only the web container reaches it.
    expose:
      - "8080"

  # The SPA lives on the 'frontend' branch, not in this tree (moved in 04c1d8f), so this compose
  # file could not build — `context: ./frontend` pointed at a directory that does not exist on
  # this branch (review finding L3). Check the branch out beside this one and point the context
  # at it:
  #
  #   git worktree add ../todoapp-frontend frontend
  #   FRONTEND_PATH=../todoapp-frontend docker compose up --build
  web:
    build:
      context: ${FRONTEND_PATH:?set FRONTEND_PATH to a checkout of the 'frontend' branch}
    restart: unless-stopped
    depends_on:
      - api
    # 8080 on both sides: the web image is nginx-unprivileged, which runs as a non-root
    # user and therefore listens on 8080 rather than 80 (review finding M10).
    ports:
      - "8080:8080"

volumes:
  todo-data:
