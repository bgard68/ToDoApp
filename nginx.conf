server {
    # 8080, not 80: the image runs as an unprivileged user and cannot bind a
    # port below 1024 (review finding M10).
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Response security headers (review finding H2). Kept in step with
    # staticwebapp.config.json — see SECURITY-HEADERS.md. `always` so they are
    # emitted on error responses too, not just 2xx/3xx.
    #
    # The script-src hash covers the inline theme script in index.html; editing
    # that script invalidates it. src/lib/csp.test.js fails if they drift.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-GW825FdRS8YFXkaacjvphmbKysoTTeAxlXyal7guZew=' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://accounts.google.com https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # No HSTS here: the compose stack is plain HTTP on localhost, and sending
    # HSTS would pin the developer's browser to HTTPS for localhost.

    # Don't advertise the exact nginx version.
    server_tokens off;

    # SPA history fallback: unknown routes return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container (same-origin for the browser -> no CORS needed).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
