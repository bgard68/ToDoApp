# Findings the merge gate will not block on, each with a reason and an expiry.
#
# This file is passed ONLY to the gating scan step. The Security tab and the
# every-severity log step still report everything, so nothing here is hidden —
# it is excluded from blocking a merge, not from being seen.
#
# An entry without an expiry is a permanent exception, and a permanent exception
# to a security gate is how the gate stops meaning anything. Every entry gets a
# date. When it lapses the finding blocks again, which is the point: the excuse
# has to be re-argued rather than inherited.
