name: CodeQL

# SAST as versioned, reviewable configuration rather than a setting in the GitHub UI.
# The repo previously relied on CodeQL "default setup" — which works, but is invisible to code
# review, can't be diffed, doesn't travel to a fork or a new repo, and can be turned off without
# leaving a trace in git history (review finding M6).
#
# NOTE: if CodeQL "default setup" is enabled in Settings > Code security, disable it before
# merging — GitHub rejects an advanced-setup workflow while default setup is active.

on:
  push:
    branches: [ main, dapper ]
  pull_request:
    branches: [ main, dapper ]
  schedule:
    # Catch newly published queries against unchanged code.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      security-events: write   # required to upload the SARIF results
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: csharp
          # security-and-quality is a superset of the default security queries. cs/log-forging
          # (review finding M1) is in the default set; the wider pack also catches the
          # maintainability issues that tend to become security issues later.
          queries: security-and-quality

      - name: Build solution
        run: dotnet build TodoApp.sln --configuration Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: '/language:csharp'
