name: Keep API warm

# BACKUP keep-warm. An external uptime monitor is the PRIMARY ping (see
# docs/deployment/cold-starts.md); this workflow is the fallback for when that monitor
# is down or its account lapses.
#
# Why it is not primary: GitHub's scheduler is best-effort and sheds high-frequency
# crons under load — silently, with no skipped-run record. Observed 2026-09-01: a
# five-hour gap between runs (06:36 → 11:45 UTC) with GitHub Actions reporting no
# incident, long enough for the F1 instance to unload and a visitor to hit a ~90s cold
# start. Nothing to fix or tune; scheduled runs simply carry no timing guarantee.
#
# It hits the ROOT endpoint only (a static health payload outside Development), so it
# warms the *app* WITHOUT querying the database — that way it does not burn the Azure
# SQL serverless free-limit. The occasional DB cold start that still happens is handled
# gracefully client-side (apiClient.js "Waking the server up…").
#
# Notes:
#   - Uses the repo Variable VITE_API_URL (Settings > Secrets and variables >
#     Actions > Variables) — the API base URL, the one that shows Swagger.
#   - The interval stays under F1's ~20 min unload window so the backup is useful on
#     its own if the external monitor stops; overlapping with it is harmless.
#   - Free Actions minutes are unlimited on PUBLIC repos (this one is public); on a
#     PRIVATE repo this counts against the monthly minutes — widen the interval there.
#   - Manual "wake it now" run before you expect traffic: gh workflow run keep-warm.yml

on:
  schedule:
    - cron: '*/10 * * * *'   # roughly every 10 minutes
  workflow_dispatch:          # allow manual "wake it now" runs

concurrency:
  group: keep-warm
  cancel-in-progress: true

permissions: {}              # no repo access needed — it just makes an HTTP call

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API root (warms the app, no DB hit)
        env:
          API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "VITE_API_URL is not set — set it to the API base URL (the one that shows Swagger). Skipping."
            exit 0
          fi
          url="${API_URL%/}/"
          echo "Pinging $url"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 40 --retry 3 --retry-all-errors "$url" || echo "000")
          echo "HTTP $code"
          # Any response (200/302/5xx) means the instance woke and served — that's the goal.
          # A total connection failure (000) is logged but does not fail the schedule (avoids alert spam).
          if [ "$code" = "000" ]; then echo "::warning::No response from $url (still waking, or unreachable)."; fi
