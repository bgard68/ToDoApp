name: Gate probes

# Every gate in this repository shown something it must reject, and failed if it
# does not. Green means one of two things — nothing is wrong, or the check is not
# looking — and nothing else here tells those apart.
#
# This is not hypothetical. Trivy ran with exit-code 0 for its entire life: it
# reported CRITICAL and HIGH findings faithfully and blocked nothing, and 28 of
# them accumulated in the Security tab behind a job that was passing. A check
# that cannot fail looks exactly like a check with nothing to report.
#
# Each step below inverts the usual sense: the probe passes when the tool exits
# non-zero. Nothing touches the real solution — every probe builds its own
# throwaway project in a scratch directory.

on:
  push:
    branches: [ main, dapper ]
    paths:
      - '.github/workflows/gate-probes.yml'
      - 'Directory.Build.props'
      - '.gitleaks.toml'
  pull_request:
    branches: [ main, dapper ]
  schedule:
    # Gates drift without anyone touching them: a tool updates, an upstream rule
    # set changes, an allowlist grows. Weekly, against unchanged code.
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-probes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probes:
    name: Prove the gates can fail
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.x'

      - name: Probe - NuGet audit rejects a vulnerable package
        run: |
          set -uo pipefail
          dir=$(mktemp -d)
          # The whole probe hinges on this file being present: without it there is
          # no audit configuration, NU1903 arrives as a plain warning, restore
          # succeeds, and the probe reports a broken gate that is actually fine.
          # A setup failure must never be readable as a gate failure.
          cp Directory.Build.props "$dir/" || { echo "::error title=Probe setup failed::Directory.Build.props not found."; exit 1; }
          {
            echo '<Project Sdk="Microsoft.NET.Sdk">'
            echo '  <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>'
            echo '  <ItemGroup>'
            echo '    <PackageReference Include="System.Net.Http" Version="4.3.0" />'
            echo '  </ItemGroup>'
            echo '</Project>'
          } > "$dir/probe.csproj"

          if dotnet restore "$dir/probe.csproj" > "$dir/out.log" 2>&1; then
            echo "::error title=Probe failed::NuGet audit accepted System.Net.Http 4.3.0, which carries a known high-severity advisory."
            tail -30 "$dir/out.log"
            exit 1
          fi
          # Restoring can fail for reasons that have nothing to do with the audit,
          # and a probe that accepts any failure proves nothing about the gate.
          if ! grep -q "NU190" "$dir/out.log"; then
            echo "::error title=Probe inconclusive::restore failed, but not on an audit warning."
            tail -30 "$dir/out.log"
            exit 1
          fi
          echo "ok  NuGet audit rejects a vulnerable package - caught, as it must be"

      - name: Probe - the compiler rejects a warning
        run: |
          set -uo pipefail
          dir=$(mktemp -d)
          cp Directory.Build.props "$dir/" || { echo "::error title=Probe setup failed::Directory.Build.props not found."; exit 1; }
          {
            echo '<Project Sdk="Microsoft.NET.Sdk">'
            echo '  <PropertyGroup>'
            echo '    <TargetFramework>net10.0</TargetFramework>'
            echo '    <OutputType>Exe</OutputType>'
            echo '  </PropertyGroup>'
            echo '</Project>'
          } > "$dir/probe.csproj"
          # CS0219: assigned but never used. A warning, and so an error here.
          echo 'class P { static void Main() { int unused = 1; } }' > "$dir/P.cs"

          if dotnet build "$dir/probe.csproj" > "$dir/out.log" 2>&1; then
            echo "::error title=Probe failed::A warning did not fail the build. TreatWarningsAsErrors is not in effect."
            tail -30 "$dir/out.log"
            exit 1
          fi
          if ! grep -q "CS0219" "$dir/out.log"; then
            echo "::error title=Probe inconclusive::build failed, but not on the planted warning."
            tail -30 "$dir/out.log"
            exit 1
          fi
          echo "ok  the compiler rejects a warning - caught, as it must be"

      - name: Probe - the test runner rejects a failing test
        run: |
          set -uo pipefail
          dir=$(mktemp -d)
          cd "$dir"
          dotnet new xunit -o probe > /dev/null 2>&1
          {
            echo 'public class ProbeTests'
            echo '{'
            echo '    [Xunit.Fact]'
            echo '    public void The_gate_can_see_a_failing_test() => Xunit.Assert.Equal(1, 2);'
            echo '}'
          } > probe/UnitTest1.cs

          if dotnet test probe > out.log 2>&1; then
            echo "::error title=Probe failed::A failing test did not fail the runner."
            tail -30 out.log
            exit 1
          fi
          echo "ok  the test runner rejects a failing test - caught, as it must be"

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin gitleaks
          rm "$archive"

      - name: Probe - gitleaks rejects a planted secret
        run: |
          set -uo pipefail
          dir=$(mktemp -d)
          # Generated at run time and never written literally: a real-looking
          # token committed here would make this file the leak its own scanner
          # reports. PAT-shaped rather than AWS-shaped, because gitleaks
          # allowlists AWS's documented example key and has no rule for bare
          # AWS key ids — both lessons already paid for once.
          body=$(head -c 64 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 36)
          printf 'github_token = "ghp_%s"\n' "$body" > "$dir/planted.txt"

          if gitleaks dir --no-banner --exit-code 1 "$dir" > "$dir/out.log" 2>&1; then
            echo "::error title=Probe failed::gitleaks did not report a planted credential."
            tail -20 "$dir/out.log"
            exit 1
          fi
          echo "ok  gitleaks rejects a planted secret - caught, as it must be"

      # Trivy is asserted by configuration rather than by behaviour, which is a
      # weaker check and a deliberate one.
      #
      # A behavioural probe needs an image that permanently carries fixable
      # CRITICAL/HIGH findings, and no such image exists. Two were tried. An
      # end-of-life release (alpine:3.14) has nothing fixed for it at all, so
      # `ignore-unfixed` skips its whole list. The superseded aspnet digest this
      # repository ran on until this morning — 28 findings when it was replaced —
      # scans clean now, because Ubuntu published the fixes in the meantime.
      #
      # That is the shape of the problem: the subject has to be vulnerable today
      # and stay vulnerable, and the world keeps patching. A probe that fails for
      # reasons unconnected to this repository is worse than no probe, because it
      # trains people to rerun red jobs.
      #
      # So this guards the thing that actually went wrong instead. The scan ran
      # with exit-code 0 for its entire life — reporting faithfully, blocking
      # nothing, while 28 findings banked up behind a passing job. Setting it back
      # is a one-character edit, and this is what refuses it.
      #
      # It used to grep the file for `exit-code: '0'` and fail on a hit. That read
      # the whole file as one setting, which stopped being true once the job gained
      # a second Trivy step that prints the findings as a table and deliberately
      # does not block. The grep cannot tell a reporting step from a gate that has
      # been switched off, and the honest fix is a probe that knows the difference
      # rather than a reporting step contorted to slip past a regex.
      #
      # Parsing the workflow also closes a hole the grep never covered. Blocking
      # needs two things — the scan exits non-zero, and nothing swallows that exit
      # — so `continue-on-error: true` with no step keyed on the scan's outcome
      # leaves a job that matches `exit-code: '1'` and still cannot fail. That is
      # the same defect as exit-code 0 wearing different clothes.
      - name: Probe - the container scan is configured to block
        run: |
          set -uo pipefail
          python3 -c 'import yaml' 2>/dev/null || {
            echo "::error title=Probe setup failed::PyYAML unavailable, cannot parse the workflow."
            exit 1
          }
          python3 - <<'PY'
          import sys, yaml

          path = ".github/workflows/container-build.yml"
          try:
              # Explicit encoding: the workflow comments carry em dashes, and a
              # runner with a non-UTF-8 locale would read a decode error as a gate
              # failure. Setup problems must not look like the gate being off.
              with open(path, encoding="utf-8") as fh:
                  wf = yaml.safe_load(fh)
              steps = [s for job in wf["jobs"].values() for s in job["steps"]]
          except Exception as exc:                      # noqa: BLE001 - setup, not a gate failure
              print(f"::error title=Probe setup failed::could not parse {path}: {exc}")
              sys.exit(1)

          trivy = [s for s in steps if "trivy-action" in str(s.get("uses", ""))]
          if not trivy:
              print(f"::error title=Probe inconclusive::no Trivy step found in {path}.")
              sys.exit(1)

          def exit_code(step):
              # The action defaults to 0, which does not block.
              return str((step.get("with") or {}).get("exit-code", "0"))

          def compensated(step):
              # continue-on-error is only survivable if a later step fails on the outcome.
              sid = step.get("id")
              if not sid:
                  return False
              return any(f"steps.{sid}.outcome" in str(s.get("if", "")) for s in steps)

          def lies_about_severity(step):
              # trivy-action ignores `severity` when building SARIF - it scans every
              # severity and says so in the log. A gate configured that way blocks on
              # findings the configuration says it ignores, which is how this job spent
              # a day looking like a CRITICAL/HIGH gate while failing on MEDIUMs.
              with_ = step.get("with") or {}
              return str(with_.get("format", "")) == "sarif" and "severity" in with_

          blocking, reporting, defused = [], [], []
          for s in trivy:
              name = s.get("name", "<unnamed>")
              if exit_code(s) != "1":
                  reporting.append(name)
              elif not s.get("continue-on-error"):
                  blocking.append(name)
              elif compensated(s):
                  blocking.append(name)
              else:
                  defused.append(name)

          mislabelled = [s.get("name", "<unnamed>") for s in trivy
                         if s.get("name", "<unnamed>") in blocking and lies_about_severity(s)]

          for name in defused:
              print(f"::error title=Probe failed::step '{name}' scans with exit-code 1 but sets "
                    "continue-on-error and nothing checks its outcome, so the scan cannot fail the job.")
          for name in mislabelled:
              print(f"::error title=Probe failed::step '{name}' gates on a SARIF-format scan while "
                    "declaring a severity filter, which trivy-action ignores for SARIF. The gate "
                    "would block on severities the configuration says it excludes.")
          if not blocking:
              print(f"::error title=Probe failed::no Trivy step in {path} can fail the job. A scan "
                    "that reports without blocking is how 28 findings banked up behind a passing job.")
          if defused or mislabelled or not blocking:
              sys.exit(1)

          for name in blocking:
              print(f"ok  '{name}' can fail the job - blocking, as it must be")
          for name in reporting:
              print(f"note  '{name}' reports without blocking - fine, it is not the gate")
          PY

      - name: All probes caught what they must
        run: echo "GATE PROBES PASSED - every gate rejected what it was shown."
