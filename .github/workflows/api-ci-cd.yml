name: Build and Deploy taskboard-06-api

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'TodoApp.sln'
      - 'Directory.Build.props'
      - '.github/workflows/api-ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'TodoApp.sln'
      - 'Directory.Build.props'
      - '.github/workflows/api-ci-cd.yml'
  workflow_dispatch:

# Read the code, and nothing else. `id-token: write` is what mints the OIDC token
# that logs in to Azure, and it is granted on the deploy job alone rather than here:
# at workflow scope the build-and-test job carries it too, and that job runs on every
# pull request. Least privilege costs one line and removes the question entirely.
permissions:
  contents: read

concurrency:
  group: api-ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  # Enforces RestoreLockedMode from Directory.Build.props — restore fails rather than silently
  # resolving a package version that differs from packages.lock.json (review finding M5).
  ContinuousIntegrationBuild: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be repointed by a compromised
      # maintainer account, and these jobs hold Azure OIDC credentials (review finding M11).
      # Dependabot understands SHA pins and keeps raising bumps.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # --locked-mode: fail if resolution would differ from the committed lock files.
      - name: Restore dependencies (locked)
        run: dotnet restore TodoApp.sln --locked-mode

      - name: Build solution
        run: dotnet build TodoApp.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/TodoApp.UnitTests/TodoApp.UnitTests.csproj --configuration Release --no-build

      # The auth flows are only exercised end to end here — previously built but never run
      # (review finding L1).
      - name: Run integration tests
        run: dotnet test tests/TodoApp.IntegrationTests/TodoApp.IntegrationTests.csproj --configuration Release --no-build

      # Fails the build on any known-vulnerable package, direct or transitive (review finding M6).
      - name: Audit dependencies for known vulnerabilities
        run: |
          set -euo pipefail
          dotnet list TodoApp.sln package --vulnerable --include-transitive 2>&1 | tee audit.log
          if grep -qiE '\b(Critical|High|Moderate)\b' audit.log; then
            echo "::error title=Vulnerable dependency::A package with a known advisory is referenced. See the log above."
            exit 1
          fi
          echo "No vulnerable packages reported."

      - name: Publish API
        run: dotnet publish src/TodoApp.WebApi/TodoApp.WebApi.csproj --configuration Release --no-build --output ./publish

      - name: Verify publish output
        run: |
          if [ ! -f ./publish/TodoApp.WebApi.dll ]; then
            echo "::error title=Publish failed::No TodoApp.WebApi.dll in ./publish - refusing to continue."
            exit 1
          fi
          echo "Publish OK: $(ls -1 ./publish | wc -l) files."

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-publish
          path: ./publish
          retention-days: 30

  # ---- Deploy ----
  # Auto-deploys on push to main. A manual "Run workflow" (workflow_dispatch) deploys whichever
  # branch is selected in the Actions UI — this is how the EF Core (main) and Dapper (dapper)
  # branches are each shipped on demand to the same App Service. PRs build + test but never deploy.
  #
  # Split into its own job gated on `environment:` so a manual deploy of a non-main branch can be
  # held for approval via the environment's protection rules, rather than shipping straight from
  # whatever branch the operator picked.
  deploy:
    name: Deploy API
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    # The only job that talks to Azure, so the only one that can mint the token.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: api-publish
          path: ./publish

      - name: Azure login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_566B4FFECC144FF99662F3E334946913 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_666F8329ACAC4EF9A4E3DFE024EB99CA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0056D27AD4F64315858EF3757BCD85C7 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: taskboard-06-api
          package: ./publish

      # Proves the thing that was deployed actually runs. Unit and integration tests pass
      # against a process this workflow starts itself; they cannot see a missing app setting,
      # a Key Vault the managed identity can no longer read, or a DI graph that only fails
      # once real configuration is bound. That gap is the whole reason to swap the API
      # implementation on the `dapper` branch and find out at runtime.
      #
      # Deliberately needs no credentials. A login attempt with a password that is wrong on
      # purpose still travels the entire path — routing, model binding, the user store, the
      # hasher — and 401 is the proof it arrived. A 500 there is the failure this catches;
      # a 200 would be considerably worse.
      - name: Smoke test the deployed API
        env:
          API: https://taskboard-06-api-aehtbcg8eha6fyf8.centralus-01.azurewebsites.net
        run: |
          set -uo pipefail

          # Wake first, assert second. Both halves of this stack sleep: the App Service plan
          # is Free F1, and the SQL database is serverless with a 60-minute auto-pause, so a
          # deploy after a quiet hour meets a cold app in front of a paused database. The
          # keep-warm workflow pings "/" every ten minutes, which keeps the app up but never
          # touches SQL — "/" answers without a query — so the database pauses anyway.
          #
          # Waking is therefore expected and is not a failure. Mixing the two would make the
          # deploy fail for being idle, which is the fastest way to teach everyone to rerun a
          # red job without reading it.
          wake() {
            what=$1; budget=$2; shift 2
            deadline=$(( $(date +%s) + budget ))
            while [ "$(date +%s)" -lt "$deadline" ]; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$@") || code=000
              case "$code" in
                000|5*) echo "  $what waking (got $code)"; sleep 10 ;;
                *)      echo "  $what awake ($code)"; return 0 ;;
              esac
            done
            echo "::error::$what did not wake within ${budget}s"
            return 1
          }

          echo "Waking the stack"
          wake "app"      180 "$API/" || exit 1
          # Any endpoint that reads the user store will do; the credentials are deliberately
          # wrong, so this wakes SQL without needing a secret.
          wake "database" 420 -X POST "$API/api/auth/login"                               -H 'Content-Type: application/json'                               -d '{"email":"smoke-test@invalid.local","password":"deliberately-wrong"}' || exit 1

          # Awake now, so every answer below is the app's real opinion. No retries here on
          # purpose: a wrong status code is the finding, not something to paper over.
          fail=0
          check() {
            name=$1; want=$2; shift 2
            actual=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$@") || actual=000
            if [ "$actual" = "$want" ]; then
              echo "ok   $name -> $actual"
            else
              echo "FAIL $name -> expected $want, got $actual"
              fail=1
            fi
          }

          echo "Checking"
          # It booted and bound its configuration.
          check "health"           200 "$API/"
          # Authorisation is on. A 200 here would mean the API is open to anyone.
          check "todos unauthed"   401 "$API/api/todos"
          # The request reached the user store and was refused on the merits rather than
          # falling over on the way. A 500 means the database or the DI graph is broken —
          # which unit and integration tests cannot see, because they never bind real config.
          check "login rejected"   401 -X POST "$API/api/auth/login"                                        -H 'Content-Type: application/json'                                        -d '{"email":"smoke-test@invalid.local","password":"deliberately-wrong"}'

          exit $fail
