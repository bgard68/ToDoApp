name: Build and Deploy Frontend (Static Web Apps)

on:
  push:
    branches: [ frontend ]
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    branches: [ frontend ]
  workflow_dispatch:

# Least privilege, matching the API workflows — this file was missed when those were hardened
# (review finding M8). Without it the job inherited the repository-default GITHUB_TOKEN scope.
# pull-requests: write is needed for the SWA action's preview-environment PR comments.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Run on pushes and on open/updated PRs (skip the "closed" event — that's handled below).
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Actions pinned to commit SHAs rather than mutable tags (review finding M11), and
      # persist-credentials: false so the checkout token isn't left in the runner's git config
      # for the rest of the job (M8).
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fails the build on a known-vulnerable dependency. Until now nothing scanned this tree at
      # all — dependabot.yml declared only nuget and github-actions (review finding M6).
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Security docs must match the tree they describe. Drift recurred four times during the
      # remediation; this fails on facts (a cited file that is gone, a retracted claim reappearing)
      # rather than on wording, so it cannot be satisfied by rephrasing.
      - name: Security docs must match the repository
        run: bash scripts/check-docs-drift.sh

      - name: Run frontend tests (gate - deploy is skipped if these fail)
        run: npm test

      # The CSP names the API origin explicitly in connect-src. If it doesn't match the
      # VITE_API_URL the bundle is built against, the browser blocks every API call and the app
      # looks broken with only a console error to explain it. This exact mistake was made once
      # already (the short host name was used instead of the real one), so it is now a build gate.
      - name: CSP connect-src must allow VITE_API_URL
        env:
          API_URL: ${{ vars.VITE_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL:-}" ]; then
            echo "::error title=VITE_API_URL unset::Set the repository Variable before deploying."
            exit 1
          fi
          origin=$(printf '%s' "$API_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          csp=$(python3 -c "import json;print(json.load(open('staticwebapp.config.json'))['globalHeaders']['Content-Security-Policy'])")
          if ! printf '%s' "$csp" | grep -qF "$origin"; then
            echo "::error title=CSP mismatch::connect-src does not allow '$origin'. The SPA would be blocked from calling its own API. Update staticwebapp.config.json (see SECURITY-HEADERS.md)."
            exit 1
          fi
          echo "OK: connect-src allows $origin"

      - name: Build And Deploy
        id: builddeploy
        # Skip for PRs from forks: secrets are not exposed to them, so the deploy would fail
        # confusingly rather than meaningfully. Pushes and same-repo PRs still deploy.
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        # Vite env vars are BUILD-TIME — stored as GitHub repository Variables.
        # NOTE: VITE_API_URL must match the connect-src origin in staticwebapp.config.json,
        # or the browser blocks every API call. See SECURITY-HEADERS.md.
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_FIELD_054249810 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # for PR comments / preview environments
          action: "upload"
          app_location: "."            # the frontend is the branch root now
          api_location: ""             # no managed API in the SWA (the API is a separate App Service)
          output_location: "dist"      # Vite build output
          production_branch: "frontend" # route pushes to this branch to the production environment

  close-pull-request:
    # When a PR is closed, tear down its preview environment.
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    name: Close Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_FIELD_054249810 }}
          action: "close"
          production_branch: "frontend"
