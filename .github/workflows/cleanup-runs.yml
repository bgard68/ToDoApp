name: Cleanup old workflow runs

# Deletes old runs of the NOISY workflows only, to keep the Actions history readable (the
# every-10-min keep-warm job piles up fast). In-progress runs are never touched.
#
# Scoped deliberately: this used to delete all but one run of EVERY workflow, which took the
# build/deploy and secret-scan history with it — the evidence you need to answer "what shipped,
# when, and did it pass?" after an incident (review finding M9). Build, security and deploy
# history is now retained; only the heartbeat noise is pruned.
#
# Runs on a daily schedule and can be triggered manually. Manual runs accept a "keep"
# input if you want to retain more than one run per workflow for that run.

on:
  schedule:
    - cron: '0 6 * * *'        # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      keep:
        description: 'How many recent runs to keep per workflow'
        required: false
        default: '1'

# Deleting runs requires actions: write. Everything else stays least-privilege.
permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP: ${{ github.event.inputs.keep || '1' }}
      # Only these workflows are pruned. Anything not listed — build/deploy, CodeQL, secret scan —
      # keeps its full history as the CI/CD audit trail (M9).
      PRUNABLE: 'keep-warm.yml cleanup-runs.yml'
    steps:
      - name: Delete old runs of the high-frequency workflows
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          echo "Repo: $repo   Keeping $KEEP most-recent completed run(s) of: $PRUNABLE"

          # Resolve only the prunable workflows by file name; everything else is left alone.
          workflow_ids=""
          for wf_file in $PRUNABLE; do
            id=$(gh api --paginate "repos/$repo/actions/workflows" \
              --jq ".workflows[] | select(.path == \".github/workflows/$wf_file\") | .id" || true)
            if [ -n "$id" ]; then
              workflow_ids="$workflow_ids $id"
            else
              echo "note: no workflow found for $wf_file (skipping)"
            fi
          done

          total_deleted=0
          for wf in $workflow_ids; do
            name=$(gh api "repos/$repo/actions/workflows/$wf" --jq '.name')
            echo "::group::$name (id $wf)"

            # Completed runs, newest-first (the API's default order). --paginate keeps
            # that order across pages, so a simple counter is enough — no re-sorting.
            run_ids=$(gh api --paginate \
              "repos/$repo/actions/workflows/$wf/runs?status=completed&per_page=100" \
              --jq '.workflow_runs[].id')

            count=0
            for run in $run_ids; do
              count=$((count + 1))
              if [ "$count" -le "$KEEP" ]; then
                echo "keep    run $run"
                continue
              fi
              if gh api -X DELETE "repos/$repo/actions/runs/$run" >/dev/null 2>&1; then
                echo "deleted run $run"
                total_deleted=$((total_deleted + 1))
              else
                echo "skip    run $run (could not delete)"
              fi
            done
            echo "::endgroup::"
          done

          echo "Done. Deleted $total_deleted run(s)."
