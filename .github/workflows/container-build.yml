name: Container build & scan

# Proves the SPA container image actually builds, and scans it for known CVEs.
#
# Two reasons this exists:
#  1. The Dockerfile is not on the deployment path (this branch ships to Azure Static Web Apps),
#     so nothing else exercises it — it could rot silently while the README advertises
#     `docker compose up`.
#  2. It closes the container-scanning gap left open by review finding M6, and re-checks the M10
#     fixes: the image must run as a non-root user, and `npm ci` must succeed against the
#     committed lock file.

on:
  push:
    branches: [ frontend ]
    paths:
      - 'Dockerfile'
      - 'nginx.conf'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - '.github/workflows/container-build.yml'
  pull_request:
    branches: [ frontend ]
  schedule:
    # Base images pick up CVEs without the Dockerfile changing.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build web image & scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # to upload the Trivy SARIF

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Loaded into the local daemon rather than pushed — there is no registry in this
      # deployment, the point is to prove it builds and to have something to scan.
      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: todoapp-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Confirms the M10 fix held: nginx-unprivileged runs as uid 101, not root.
      - name: Image must not run as root
        run: |
          set -euo pipefail
          user=$(docker image inspect todoapp-web:ci --format '{{.Config.User}}')
          echo "Config.User = '${user}'"
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error title=Container runs as root::The web image must run as a non-root user (review finding M10)."
            exit 1
          fi

      # The security headers are only useful if nginx actually emits them. Start the container
      # and read them off a real response — the unit tests can only check the config text.
      - name: Serve a request and assert the security headers
        run: |
          set -euo pipefail

          # --add-host api: nginx resolves proxy_pass upstreams at config-parse time, so the
          # `proxy_pass http://api:8080` block makes it refuse to start unless that name exists.
          # In normal use docker compose provides it; standalone we point it at loopback. Only
          # `/` is exercised here (static files), so nothing is actually proxied.
          docker run -d --name web --add-host api:127.0.0.1 -p 8080:8080 todoapp-web:ci

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error title=Container did not serve::nginx never answered on :8080."
            docker logs web || true
            docker rm -f web || true
            exit 1
          fi

          headers=$(curl -sSI http://127.0.0.1:8080/)
          echo "$headers"
          for h in "content-security-policy" "x-content-type-options" "x-frame-options" "referrer-policy" "permissions-policy"; do
            if ! printf '%s' "$headers" | tr 'A-Z' 'a-z' | grep -q "^$h:"; then
              echo "::error title=Missing header::$h was not present on a real response (review finding H2)."
              docker logs web || true
              docker rm -f web || true
              exit 1
            fi
          done
          echo "All baseline security headers present on a live response."
          docker rm -f web

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: todoapp-web:ci
          format: sarif
          output: trivy-web.sarif
          severity: CRITICAL,HIGH
          # `ignore-unfixed` already drops everything there is no patch for, so whatever
          # survives it is fixable by definition — a base image that has moved on. Reporting
          # those rather than failing is what let 28 of them accumulate on main unnoticed:
          # they were not waiting on the maintainer, the maintainer had already shipped.
          # Blocking is only alert fatigue when the alert is not actionable, and after
          # ignore-unfixed it always is.
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v3
        with:
          sarif_file: trivy-web.sarif
          category: trivy-container
