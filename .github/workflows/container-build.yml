name: Container build & scan

# Proves the API container image actually builds, and scans it for known CVEs.
#
# Two reasons this exists:
#  1. The Dockerfile is not on the deployment path (App Service takes a zip), so nothing else
#     exercises it — it could rot silently while the README advertises `docker compose up`.
#  2. It closes the container-scanning gap left open by review finding M6. Building here also
#     validates the locked-mode restore added for M5: if the lock files and project files
#     disagree, this build fails.

on:
  push:
    branches: [ main, dapper ]
    paths:
      - 'Dockerfile.api'
      - 'docker-compose.yml'
      - 'src/**'
      - 'Directory.Build.props'
      - '.github/workflows/container-build.yml'
  # No paths filter on pull_request, deliberately. A path-filtered check never
  # reports on a pull request that misses its paths, and a required check that
  # never reports blocks the merge for ever — so these could not be required,
  # which is how auto-merge landed two bumps here while this job was failing.
  # The push trigger keeps its filter: no reason to rebuild on a docs edit.
  pull_request:
    branches: [ main, dapper ]
  schedule:
    # Base images pick up CVEs without the Dockerfile changing.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build API image & scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # to upload the Trivy SARIF

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Loaded into the local daemon rather than pushed — there is no registry in this
      # deployment, the point is to prove it builds and to have something to scan.
      - name: Build API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          load: true
          tags: todoapp-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Confirms the M10 fix held: the image must not run as root.
      - name: Image must not run as root
        run: |
          set -euo pipefail
          user=$(docker image inspect todoapp-api:ci --format '{{.Config.User}}')
          echo "Config.User = '${user}'"
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error title=Container runs as root::Dockerfile.api must set a non-root USER (review finding M10)."
            exit 1
          fi

      # This step is both the report and the gate, and it is table-format for a reason
      # that cost a day to find.
      #
      # The gate used to hang off a `format: sarif` step carrying `severity: CRITICAL,HIGH`.
      # trivy-action ignores `severity` when it builds SARIF — it logs "Building SARIF
      # report with all severities" and scans everything, so that input never applied.
      # `exit-code: '1'` on that step therefore failed the job on any fixable finding at
      # any severity, including LOW and MEDIUM, while every comment and input here said
      # CRITICAL,HIGH. The configuration and the behaviour disagreed, and the
      # configuration is the one that was reviewed.
      #
      # Gating on the table scan makes the severity input real. `ignore-unfixed` already
      # drops everything there is no patch for, so whatever survives is fixable by
      # definition — a base image that has moved on. Reporting those rather than failing
      # is what let 28 of them accumulate on main unnoticed: they were not waiting on
      # Microsoft, Microsoft had already shipped. Blocking is only alert fatigue when the
      # alert is not actionable, and after it always is.
      #
      # Table format also means a red run names the CVEs in its own log. The SARIF step
      # below prints nothing a human can read, which is why a failing run used to end in
      # a bare `exit code 1` and the only way to learn what to bump was to rebuild the
      # image locally — exactly the friction that gets a red gate dismissed rather than
      # fixed.
      #
      # `continue-on-error` with the failure raised further down, so that a red scan
      # still reaches the upload step. Failing here skipped it, and the Security tab
      # received the SARIF only on runs that had nothing to report — the findings were
      # discarded in precisely the case they were collected for.
      - name: Scan image and report findings
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: todoapp-api:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      # Deliberately every severity, and deliberately not the gate: the Security tab is
      # the place to see a MEDIUM coming before it is worth blocking on. `exit-code: '0'`
      # because this step reports, and the step above decides.
      - name: Build SARIF for the Security tab
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: todoapp-api:ci
          format: sarif
          output: trivy-api.sarif
          exit-code: '0'
          ignore-unfixed: true

      # `always()` so the upload also happens on the failing runs. Guarded on the file
      # existing: if the scan died before writing the SARIF, upload-sarif would fail with
      # a missing-file error that masks the real one.
      - name: Upload scan results
        if: always() && hashFiles('trivy-api.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-api.sarif
          category: trivy-container

      # The gate itself. Kept last so a red X here means "fixable CVEs in the image" and
      # the SARIF is already in the Security tab to say which.
      - name: Fail on fixable CRITICAL/HIGH findings
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error title=Fixable CVEs in the API image::Trivy found CRITICAL/HIGH vulnerabilities that have a patch available. See the table in 'Scan image and report findings' above, and the Security tab (category trivy-container). Usually the fix is to refresh the base image digests in Dockerfile.api."
          exit 1
