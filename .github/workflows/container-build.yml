name: Container build & scan

# Proves the API container image actually builds, and scans it for known CVEs.
#
# Two reasons this exists:
#  1. The Dockerfile is not on the deployment path (App Service takes a zip), so nothing else
#     exercises it — it could rot silently while the README advertises `docker compose up`.
#  2. It closes the container-scanning gap left open by review finding M6. Building here also
#     validates the locked-mode restore added for M5: if the lock files and project files
#     disagree, this build fails.

on:
  push:
    branches: [ main, dapper ]
    paths:
      - 'Dockerfile.api'
      - 'docker-compose.yml'
      - 'src/**'
      - 'Directory.Build.props'
      - '.github/workflows/container-build.yml'
  # No paths filter on pull_request, deliberately. A path-filtered check never
  # reports on a pull request that misses its paths, and a required check that
  # never reports blocks the merge for ever — so these could not be required,
  # which is how auto-merge landed two bumps while this job was failing. The
  # push trigger keeps its filter: there is no reason to rebuild on a docs edit.
  pull_request:
    branches: [ main, dapper ]
  schedule:
    # Base images pick up CVEs without the Dockerfile changing.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build API image & scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # to upload the Trivy SARIF

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Loaded into the local daemon rather than pushed — there is no registry in this
      # deployment, the point is to prove it builds and to have something to scan.
      - name: Build API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          load: true
          tags: todoapp-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Confirms the M10 fix held: the image must not run as root.
      - name: Image must not run as root
        run: |
          set -euo pipefail
          user=$(docker image inspect todoapp-api:ci --format '{{.Config.User}}')
          echo "Config.User = '${user}'"
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error title=Container runs as root::Dockerfile.api must set a non-root USER (review finding M10)."
            exit 1
          fi

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: todoapp-api:ci
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          # `ignore-unfixed` already drops everything there is no patch for, so whatever
          # survives it is fixable by definition — a base image that has moved on. Reporting
          # those rather than failing is what let 28 of them accumulate unnoticed: they were
          # not waiting on Microsoft, Microsoft had already shipped. Blocking is only alert
          # fatigue when the alert is not actionable, and after `ignore-unfixed` it always is.
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: trivy-api.sarif
          category: trivy-container
