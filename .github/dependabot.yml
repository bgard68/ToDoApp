# Dependabot version updates - keeps GitHub Actions and NuGet dependencies current.
# Alerts must also be enabled in the repo Settings for these to surface.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Every ecosystem below is GROUPED, so related updates arrive as one pull request rather than one
# per package. That is not tidiness — ungrouped, two classes of update are born unmergeable:
#
#   1. github-actions: codeql-action's init, analyze and upload-sarif must run the SAME version, or
#      the job fails with "Loaded a configuration file for version X, but running version Y". One
#      pull request per sub-action means each one creates that mismatch on its own branch, so none
#      of them can go green alone and no rebase can help. On 2026-08-17 there were eight such pull
#      requests open across three branches, all permanently red.
#
#   2. nuget: one package bump changes every packages.lock.json that resolves it transitively -
#      five of them for a single Microsoft.EntityFrameworkCore bump. Dependabot regenerates only
#      the lock file of the project it edited, so `dotnet restore --locked-mode` fails with NU1004.
#      Grouping does not fully solve this (a bump can still leave a dependent project's lock file
#      stale, needing `dotnet restore TodoApp.sln --force-evaluate`), but it turns five broken pull
#      requests into one that needs fixing once.
#
# Actions are grouped across ALL update types, because the sub-action version constraint holds
# regardless of whether a bump is major, minor or patch. NuGet and npm group minor and patch only,
# so a major still arrives on its own and gets read properly. Docker is grouped across all update
# types too, for a different reason: every FROM is digest-pinned, so what arrives is a new digest
# within the same tag rather than a semver bump, and an update-types filter has nothing to act on.
version: 2
updates:
  # GitHub Actions used in .github/workflows (actions/checkout, azure/login, gitleaks, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  # NuGet packages across the solution (TodoApp.sln at the repo root)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Held at the last permissively licensed major, pending a planned refactor.
    #
    # FluentAssertions 8 moved to the Xceed Community License and MediatR 13 to a
    # commercial one. Both are free at this project's size, and neither is a licence
    # this project needs to accept to keep a test assertion library and an in-process
    # mediator working. 6.12.2 and 12.5.0 are Apache 2.0 with no conditions, and carry
    # no advisory — `dotnet list package --vulnerable` is clean.
    #
    # Ignored rather than closed each week: a decision that has to be retaken every
    # Monday is not a decision. Remove these two entries when the refactor lands and
    # the upgrade is wanted; patches within the current major still arrive.
    ignore:
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "MediatR"
        update-types: ["version-update:semver-major"]
      - dependency-name: "FluentValidation*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Swashbuckle.AspNetCore"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Data.SqlClient"
        update-types: ["version-update:semver-major"]


  # Base images for the API container (Dockerfile.api). Digest pinning is what makes the
  # build reproducible, and it is also what makes this entry necessary: a digest never
  # floats, so without Dependabot nothing re-pins it and the base silently ages.
  #
  # That is survivable only while the findings in a stale base are unfixable — `ignore-unfixed`
  # on the scan gate drops those. The first FIXABLE CVE in a pinned base fails
  # `Container build & scan` correctly, and with no entry here there is no automated route to
  # a newer digest: it becomes a hand-bump, blocking every other update on the branch until
  # somebody does it. That is the shape of the outage #153 fixed, arriving by a second route.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]

  # GitHub Actions on the dapper branch. Dependabot only reads this file from the DEFAULT branch,
  # so every branch that needs updates must be declared here explicitly (review finding M6).
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dapper"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "dapper"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Held at the last permissively licensed major, pending a planned refactor.
    #
    # FluentAssertions 8 moved to the Xceed Community License and MediatR 13 to a
    # commercial one. Both are free at this project's size, and neither is a licence
    # this project needs to accept to keep a test assertion library and an in-process
    # mediator working. 6.12.2 and 12.5.0 are Apache 2.0 with no conditions, and carry
    # no advisory — `dotnet list package --vulnerable` is clean.
    #
    # Ignored rather than closed each week: a decision that has to be retaken every
    # Monday is not a decision. Remove these two entries when the refactor lands and
    # the upgrade is wanted; patches within the current major still arrive.
    ignore:
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "MediatR"
        update-types: ["version-update:semver-major"]
      - dependency-name: "FluentValidation*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Swashbuckle.AspNetCore"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Data.SqlClient"
        update-types: ["version-update:semver-major"]


  # Same, for dapper's Dockerfile.api. Declared here because Dependabot reads this file only
  # from the default branch (review finding M6).
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dapper"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]

  # The React SPA lives on the 'frontend' branch. Without these entries its dependency tree —
  # React, Vite, Vitest and everything transitive — was monitored by nothing at all (M6).
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Held pending the same planned refactor as the NuGet majors above. React 19
    # changes rendering and effect semantics; jsdom 30 and jest-dom 8 change what
    # the test environment does underneath those. Upgrading them piecemeal means
    # debugging three things at once, so they move together or not at all.
    #
    # Majors only. Patches and minors still arrive, so a security fix inside the
    # current major is not blocked.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/jest-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  # frontend's Dockerfile — node:22-alpine to build the bundle, nginx-unprivileged to serve it.
  # Both digest-pinned, and it is this branch that has already had a dependency update blocked
  # by the image scan, so it is the one least able to absorb a base nobody is updating.
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]
